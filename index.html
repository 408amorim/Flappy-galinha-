<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flappy Galinha</title>
<style>
:root{--bg:#eef2f7;--fg:#1b2430;--muted:#5b6778;--card:#fff;--line:#d5dce6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--fg:#e8edf5;--muted:#93a0b4;--card:#1a212d;--line:#2c3646}}
:root[data-theme="dark"]{--bg:#10141c;--fg:#e8edf5;--muted:#93a0b4;--card:#1a212d;--line:#2c3646}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 18px;user-select:none;-webkit-user-select:none}
canvas{width:min(92vw,360px);aspect-ratio:360/540;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);touch-action:none}
.panel{width:min(92vw,360px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-sizing:border-box;font-size:14px}
.row{display:flex;align-items:center;gap:10px}
#foco{width:min(92vw,360px);border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;touch-action:manipulation;
  background:linear-gradient(90deg,#3b82f6 var(--p,0%),#64748b var(--p,0%))}
#foco.pronto{background:#2563eb;box-shadow:0 0 0 3px #93c5fd}
.shop{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 4px}
.shop button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
.shop button.sel{border-color:#3b82f6;outline:2px solid #3b82f6}
.shop button:disabled{opacity:.5}
small{color:var(--muted)}
#ad{width:100%;margin-top:6px;border:0;border-radius:10px;padding:10px;font-size:14px;font-weight:700;color:#fff;background:#16a34a;cursor:pointer}
#ad:disabled{opacity:.5}
</style>
</head>
<body>
<canvas id="c" width="360" height="540"></canvas>
<button id="foco">⏳ ESPECIAL</button>
<div class="panel">
  <div class="row"><b>Loja de pássaros</b><span style="margin-left:auto">🥚 <b id="eggs">0</b></span></div>
  <div class="shop" id="shop"></div>
  <button id="ad" hidden>🎁 Assistir anúncio e ganhar 5 ovos</button>
  <small>🥚 = ovos do jogo (grátis). 💳 = pássaro premium (dinheiro real).</small><br><small id="pmsg"></small>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=360,H=540,FL=34,PTS=5;
// alta resolução: desenha em pelo menos 2x e reduz, deixando tudo mais nítido
const DPR=Math.min(3,Math.max(2,window.devicePixelRatio||1));
cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
const THEMES=[['Dia claro',200,0],['Pôr do sol',20,-5],['Noite',230,-18],['Deserto',40,0],['Gelo',190,12],['Floresta',130,-8],['Oceano',210,-10],['Vulcão',5,-14],['Espaço',265,-22],['Doce',320,12],['Neon',290,-12],['Pântano',90,-14]];
const BIRDS=[
 {k:'galinha',n:'Galinha',col:'#f7f3e8',p:0},
 {k:'pintinho',n:'Pintinho',col:'#ffe14d',p:15},
 {k:'urubu',n:'Urubu',col:'#3a3a3a',p:40},
 {k:'dragao',n:'Dragão',col:'#40c057',p:120},
 {k:'tucano',n:'Tucano',col:'#ffb300',brl:'R$ 4,90'},
 {k:'papagaio',n:'Papagaio',col:'#3ec14f',brl:'R$ 6,90'},
 {k:'arara',n:'Arara',col:'#e53935',brl:'R$ 9,90'}];
const PAY={api:null,player:()=>{try{let p=localStorage.getItem('fg_pid');if(!p){p=crypto.randomUUID();localStorage.setItem('fg_pid',p)}return p}catch(e){return 'anon'}}};
const th=L=>{const t=THEMES[L%12];return{n:t[0],h:(t[1]+Math.floor(L/12)*23)%360,l:t[2]}};
// Dificuldade por faixas (o jogador não vê isso): v = velocidade, g = abertura, d = distância entre canos
function cfg(L){
  if(L<=12)return{v:1.55+L*0.012,g:215-L*0.8,d:295};                       // super fácil
  if(L<=24)return{v:1.85+(L-13)*0.018,g:190-(L-13)*0.6,d:265};             // fácil
  if(L<=35)return{v:2.15+(L-25)*0.022,g:168-(L-25)*0.7,d:235};            // médio
  return{v:2.5+Math.min(64,L-36)*0.028,g:Math.max(114,150-(L-36)*0.5),d:Math.max(175,205-(L-36)*0.4)}; // difícil
}
// progresso e preferências ficam salvos no aparelho
let save={eggs:0,owned:[0],sel:0,best:0,maxL:0};
try{Object.assign(save,JSON.parse(localStorage.getItem('fg4')||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem('fg4',JSON.stringify(save))}catch(e){}};
const $=id=>document.getElementById(id),msg=t=>{$('pmsg').textContent=t};
function ui(){
  $('eggs').textContent=save.eggs;$('shop').innerHTML='';
  BIRDS.forEach((b,i)=>{
    const e=document.createElement('button'),own=save.owned.includes(i);
    e.className=save.sel===i?'sel':'';
    e.innerHTML=`<span style="color:${b.col};text-shadow:0 0 1px #000">●</span> ${b.n}<br><small>${own?(save.sel===i?'em uso':'usar'):(b.brl?'💳 '+b.brl:'🥚 '+b.p)}</small>`;
    e.disabled=!own&&!b.brl&&save.eggs<b.p;
    e.onclick=()=>{if(!own&&b.brl){buyReal(i);return}if(!own){save.eggs-=b.p;save.owned.push(i)}save.sel=i;persist();ui()};
    $('shop').appendChild(e);
  });
}
async function buyReal(i){
  if(!PAY.api){msg('Pagamento real desligado nesta versão (modo demonstração). Defina PAY.api com o endereço do seu servidor para ativar.');return}
  try{const r=await fetch(PAY.api+'/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bird:BIRDS[i].k,player:PAY.player()})});const d=await r.json();location.href=d.url}catch(e){msg('Falha ao iniciar o pagamento.')}
}
async function syncPaid(){
  if(!PAY.api)return;
  try{const r=await fetch(PAY.api+'/entitlements?player='+PAY.player());const d=await r.json();
  BIRDS.forEach((b,i)=>{if(b.brl&&d.birds.includes(b.k)&&!save.owned.includes(i))save.owned.push(i)});persist();ui()}catch(e){}
}
// ---------- pássaros ----------
function drawBird(k,t){
  const r=12,fl=Math.sin(t/60)*0.6;
  const c=(x,y,q,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,q,0,7);ctx.fill()};
  const tri=(a,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(a[2],a[3]);ctx.lineTo(a[4],a[5]);ctx.fill()};
  const wing=col=>{ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(-4,3,6,4,fl,0,7);ctx.fill()};
  const eye=()=>{c(5,-4,4,'#fff');c(6,-4,1.8,'#000');c(6.6,-4.6,.7,'#fff')};
  const beak=col=>tri([10,0,19,3,10,6],col);
  ctx.save();
  switch(k){
  case 'galinha':
    tri([-10,-3,-24,-13,-11,6],'#fff');c(0,0,r,'#f7f3e8');
    c(-2,-r+1,3.5,'#e53935');c(2,-r-1,4,'#e53935');c(6,-r+1,3.5,'#e53935');
    beak('#ff9800');c(11,8,3,'#e53935');eye();wing('#e2d9c0');break;
  case 'pintinho':
    ctx.scale(.85,.85);c(0,0,r,'#ffe14d');tri([-1,-r+1,2,-r-7,5,-r+1],'#ffe14d');
    beak('#ff9800');eye();wing('#f2c200');break;
  case 'urubu':
    tri([-10,-2,-24,-8,-11,7],'#222');c(0,0,r,'#2b2b2b');c(7,-2,6,'#c98b8b');
    tri([11,-3,21,2,12,5],'#e0d3a8');c(8,-4,2.2,'#fff');c(8.6,-4,1,'#000');wing('#151515');break;
  case 'dragao':
    tri([-4,-2,-17,-19-fl*9,4,-8],'#e8590c');tri([-10,0,-25,7,-10,7],'#2f9e44');
    c(0,0,r,'#40c057');ctx.fillStyle='#c0eb75';ctx.beginPath();ctx.ellipse(2,5,8,5,0,0,7);ctx.fill();
    tri([1,-r+1,-1,-r-8,5,-r+2],'#ffd8a8');tri([7,-r+3,8,-r-6,11,-r+4],'#ffd8a8');
    c(10,2,4.5,'#40c057');c(12,1,1,'#2b8a3e');eye();wing('#2f9e44');break;
  case 'tucano':
    tri([-10,-2,-23,-8,-11,6],'#222');c(0,0,r,'#1c1c1c');c(6,3,5,'#fff59d');
    tri([9,-5,29,-1,9,7],'#ffb300');tri([21,-3,29,-1,24,3],'#e53935');eye();wing('#333');break;
  case 'papagaio':
    tri([-10,-2,-25,-9,-11,6],'#2f9e44');tri([-20,-6,-27,-11,-21,-2],'#1971c2');
    c(0,0,r,'#3ec14f');c(5,-8,4,'#e53935');tri([10,-3,19,2,11,6],'#ff9800');
    tri([14,2,19,2,14,8],'#e65100');eye();wing('#1971c2');break;
  case 'arara':
    tri([-9,-2,-31,-10,-11,5],'#1e6fe0');tri([-9,0,-29,3,-11,7],'#e53935');
    c(0,0,r,'#e53935');c(7,-2,5.5,'#fff');tri([11,-3,20,2,12,6],'#222');
    c(5,-4,2,'#000');wing('#1e6fe0');ctx.fillStyle='#ffd600';ctx.beginPath();ctx.ellipse(-3,2,4,1.8,fl,0,7);ctx.fill();break;
  }
  ctx.restore();
}
function drawEgg(x,y,t){
  const g=ctx.createRadialGradient(x,y,2,x,y,19);g.addColorStop(0,'rgba(255,240,180,.55)');g.addColorStop(1,'rgba(255,240,180,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,19,0,7);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t/250+x/30)*0.2);
  const e=ctx.createLinearGradient(-8,-10,8,10);e.addColorStop(0,'#fffdf5');e.addColorStop(1,'#efe2c0');
  ctx.fillStyle=e;ctx.strokeStyle='#cdb98a';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.ellipse(0,0,8,10.5,0,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.95)';ctx.beginPath();ctx.ellipse(-3,-4,2,3.5,0.4,0,7);ctx.fill();
  ctx.restore();
}
// ---------- cenário ----------
const clouds=Array.from({length:5},(_,i)=>({x:i*80,y:110+Math.random()*170,s:.7+Math.random()*.8}));
const stars=Array.from({length:45},()=>({x:Math.random()*W,y:Math.random()*(H-140),r:Math.random()*1.3+.3,p:Math.random()*6}));
function hills(off,col,amp,base,f){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=6)ctx.lineTo(x,base-Math.sin((x+off)*f)*amp-Math.sin((x+off)*f*2.3)*amp*.4);
  ctx.lineTo(W,H);ctx.fill()}
function scenery(t,S,h,l){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`hsl(${h},68%,${36+l}%)`);g.addColorStop(.6,`hsl(${h},68%,${64+l}%)`);g.addColorStop(1,`hsl(${h+15},70%,${82+l}%)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(l<=-10)stars.forEach(s=>{ctx.fillStyle=`rgba(255,255,255,${.35+.4*Math.sin(t/500+s.p)})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()});
  const sx=290,sy=120,sg=ctx.createRadialGradient(sx,sy,4,sx,sy,70);
  sg.addColorStop(0,l<=-10?'rgba(220,230,255,.9)':'rgba(255,245,200,.95)');sg.addColorStop(.25,l<=-10?'rgba(200,215,255,.35)':'rgba(255,235,160,.35)');sg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,70,0,7);ctx.fill();
  const ca=l<=-12?.3:.6;
  clouds.forEach(c=>{const x=((c.x-S*0.12*c.s)%(W+120)+W+120)%(W+120)-60;
    ctx.fillStyle=`rgba(255,255,255,${ca})`;
    [[0,0,18],[16,-6,15],[32,0,17],[16,6,15]].forEach(p=>{ctx.beginPath();ctx.arc(x+p[0]*c.s,c.y+p[1]*c.s,p[2]*c.s,0,7);ctx.fill()})});
  hills(S*0.15,`hsl(${h+10},38%,${58+l/1.5}%)`,26,H-FL-90,.012);
  hills(S*0.35,`hsl(${h+20},40%,${44+l/2}%)`,18,H-FL-40,.02);
}
// ---------- jogo ----------
let st,bird,pipes,eggsL,parts,score,L,flash,banner,meter,focusT,lastSec=5,last=0,nextX,got,overAt=0,scroll=0;
function reset(){st='ready';bird={x:90,y:H/2,vy:0,r:12};pipes=[];eggsL=[];parts=[];score=0;L=0;flash=0;banner=0;meter=0;focusT=0;nextX=W+20;got=0;scroll=0;setFoco()}
function flap(){
  if(st==='over'){if(performance.now()-overAt>350)reset();return}
  if(st==='ready')st='play';
  bird.vy=-7.2;
}
function useFocus(){if(st==='play'&&meter>=100&&focusT<=0){focusT=300;lastSec=5;meter=0;setFoco()}}
function setFoco(){
  const b=$('foco');b.style.setProperty('--p',meter+'%');
  b.className=meter>=100&&focusT<=0?'pronto':'';
  b.textContent=focusT>0?'⏳ ESPECIAL: '+Math.ceil(focusT/60)+'s':meter>=100?'⏳ ESPECIAL PRONTO — toque!':'⏳ ESPECIAL '+Math.floor(meter)+'% (pegue ovos)';
}
function die(){if(st==='over')return;st='over';overAt=performance.now();
  if(score>save.best)save.best=score;if(L>save.maxL)save.maxL=L;persist();ui()}
function spawn(){
  const C=cfg(L),gap=C.g,top=70+Math.random()*(H-FL-140-gap);
  pipes.push({x:nextX,top,gap,w:52,done:false});
  if(Math.random()<0.85)eggsL.push({x:nextX+26,y:top+gap*(0.3+Math.random()*0.4)});
  nextX+=C.d;
}
function burst(x,y){for(let i=0;i<12;i++){const a=Math.random()*6.28,s=1+Math.random()*2.6;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1})}}
function update(rdt){
  parts=parts.filter(p=>{p.x+=p.vx*rdt;p.y+=p.vy*rdt;p.life-=0.04*rdt;return p.life>0});
  if(st!=='play')return;
  let dt=rdt;
  if(focusT>0){dt=rdt*0.45;focusT-=rdt;if(focusT<=0){focusT=0;setFoco()}else{const sc=Math.ceil(focusT/60);if(sc!==lastSec){lastSec=sc;setFoco()}}}
  const sp=cfg(L).v*dt;nextX-=sp;scroll+=sp;
  if(nextX<W+20)spawn();
  bird.vy+=0.42*dt;bird.vy=Math.min(9,bird.vy);bird.y+=bird.vy*dt;
  pipes.forEach(p=>{p.x-=sp;
    if(!p.done&&p.x+p.w<bird.x){p.done=true;score++;
      const nl=Math.min(100,Math.floor(score/PTS));
      if(nl>L){L=nl;flash=1;banner=120}}
    if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+p.w&&(bird.y-bird.r<p.top||bird.y+bird.r>p.top+p.gap))die()});
  eggsL=eggsL.filter(c=>{c.x-=sp;
    if(Math.hypot(c.x-bird.x,c.y-bird.y)<bird.r+15){save.eggs++;got++;burst(c.x,c.y);if(focusT<=0){meter=Math.min(100,meter+20);setFoco()}return false}return c.x>-20});
  pipes=pipes.filter(p=>p.x>-80);
  if(bird.y-bird.r<0||bird.y+bird.r>H-FL)die();
  flash=Math.max(0,flash-0.03*rdt);banner=Math.max(0,banner-rdt);
}
const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fill()};
function draw(t){
  const T=th(L),h=T.h,l=T.l,S=st==='ready'?t*0.03:scroll;
  scenery(t,S,h,l);
  pipes.forEach(p=>{
    const b=ctx.createLinearGradient(p.x,0,p.x+p.w,0);
    b.addColorStop(0,`hsl(${h+120},45%,${30+l/2}%)`);b.addColorStop(.3,`hsl(${h+120},48%,${56+l/2}%)`);b.addColorStop(.7,`hsl(${h+120},45%,${42+l/2}%)`);b.addColorStop(1,`hsl(${h+120},45%,${28+l/2}%)`);
    ctx.fillStyle=b;ctx.fillRect(p.x,0,p.w,p.top);ctx.fillRect(p.x,p.top+p.gap,p.w,H);
    const c=ctx.createLinearGradient(p.x-4,0,p.x+p.w+4,0);
    c.addColorStop(0,`hsl(${h+120},50%,${26+l/2}%)`);c.addColorStop(.3,`hsl(${h+120},52%,${52+l/2}%)`);c.addColorStop(1,`hsl(${h+120},50%,${26+l/2}%)`);
    ctx.fillStyle=c;rr(p.x-4,p.top-18,p.w+8,18,4);rr(p.x-4,p.top+p.gap,p.w+8,18,4);
    ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(p.x+7,0,3,p.top-18);ctx.fillRect(p.x+7,p.top+p.gap+18,3,H);
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(p.x-4,p.top,p.w+8,3);ctx.fillRect(p.x-4,p.top+p.gap-3,p.w+8,3);
  });
  eggsL.forEach(c=>drawEgg(c.x,c.y,t));
  const gg=ctx.createLinearGradient(0,H-FL,0,H);gg.addColorStop(0,`hsl(${h+30},35%,${34+l/2}%)`);gg.addColorStop(1,`hsl(${h+30},35%,${20+l/2}%)`);
  ctx.fillStyle=gg;ctx.fillRect(0,H-FL,W,FL);
  ctx.fillStyle=`hsl(${h+90},48%,${46+l/2}%)`;ctx.fillRect(0,H-FL,W,7);
  ctx.fillStyle='rgba(0,0,0,.12)';for(let x=-(S%24);x<W;x+=24){ctx.beginPath();ctx.moveTo(x,H-FL+7);ctx.lineTo(x+12,H-FL+7);ctx.lineTo(x+6,H);ctx.lineTo(x-6,H);ctx.fill()}
  ctx.save();ctx.translate(bird.x,bird.y+(st==='ready'?Math.sin(t/200)*5:0));
  ctx.rotate(Math.max(-0.5,Math.min(0.7,bird.vy*0.08)));
  ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=6;ctx.shadowOffsetY=2;
  drawBird(BIRDS[save.sel].k,t);
  ctx.restore();
  parts.forEach(p=>{ctx.fillStyle=`rgba(255,224,130,${p.life})`;ctx.beginPath();ctx.arc(p.x,p.y,1.5+p.life*2.2,0,7);ctx.fill()});
  if(focusT>0){
    const v=ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.75);
    v.addColorStop(0,'rgba(60,130,255,0.10)');v.addColorStop(1,'rgba(20,60,200,0.45)');
    ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  }
  if(focusT>0){ctx.textAlign='center';ctx.font='bold 64px system-ui,sans-serif';ctx.lineWidth=6;ctx.strokeStyle='rgba(0,40,120,.45)';ctx.fillStyle='rgba(255,255,255,.55)';const n=Math.ceil(focusT/60);ctx.strokeText(n,W/2,H/2+20);ctx.fillText(n,W/2,H/2+20);ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(W/2-50,H/2+34,100*(focusT/300),5)}
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*0.6})`;ctx.fillRect(0,0,W,H)}
  ctx.textAlign='center';ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.font='bold 46px system-ui,sans-serif';ctx.strokeText(score,W/2,70);ctx.fillText(score,W/2,70);
  ctx.font='bold 13px system-ui,sans-serif';
  const tag=`NÍVEL ${L} · ${T.n.toUpperCase()}`;
  ctx.strokeText(tag,W/2,94);ctx.fillText(tag,W/2,94);
  if(L<100){ctx.fillStyle='rgba(0,0,0,.35)';rr(W/2-60,102,120,6,3);
    ctx.fillStyle='#fff';rr(W/2-60,102,Math.max(6,120*((score%PTS)/PTS)),6,3)}
  ctx.fillStyle='#fff';ctx.textAlign='left';
  ctx.strokeText('🥚 '+save.eggs,12,24);ctx.fillText('🥚 '+save.eggs,12,24);ctx.textAlign='center';
  if(banner>0){ctx.globalAlpha=Math.min(1,banner/30);ctx.font='bold 26px system-ui,sans-serif';
    ctx.strokeText('NÍVEL '+L+'!',W/2,H/2-60);ctx.fillText('NÍVEL '+L+'!',W/2,H/2-60);ctx.globalAlpha=1}
  if(st==='ready'){ctx.font='bold 22px system-ui,sans-serif';
    ctx.strokeText('Toque para começar',W/2,H/2+70);ctx.fillText('Toque para começar',W/2,H/2+70);
    ctx.font='bold 13px system-ui,sans-serif';
    ctx.strokeText('Suba de nível a cada '+PTS+' pontos',W/2,H/2+96);ctx.fillText('Suba de nível a cada '+PTS+' pontos',W/2,H/2+96)}
  if(st==='over'){
    ctx.fillStyle='rgba(0,0,0,.6)';rr(40,H/2-100,W-80,200,14);
    ctx.fillStyle='#fff';ctx.font='bold 28px system-ui,sans-serif';ctx.fillText('Fim de jogo',W/2,H/2-55);
    ctx.font='18px system-ui,sans-serif';
    ctx.fillText('Pontos: '+score+'  ·  Nível '+L,W/2,H/2-20);
    ctx.fillText('Recorde: '+save.best+'  ·  Melhor nível: '+save.maxL,W/2,H/2+8);
    ctx.fillText('Ovos: +'+got,W/2,H/2+36);
    ctx.font='15px system-ui,sans-serif';ctx.fillText('Toque para jogar de novo',W/2,H/2+76);
  }
}
function loop(t){
  const dt=Math.min(2,(t-last)/16.667||1);last=t;
  update(dt);draw(t);requestAnimationFrame(loop);
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
$('foco').addEventListener('pointerdown',e=>{e.preventDefault();useFocus()});
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}
  if(e.code==='KeyF'||e.code==='ShiftLeft'){e.preventDefault();useFocus()}
});

const AD=window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()?Capacitor.Plugins.AdMob:null;
if(AD){
  const ADID='ca-app-pub-3940256099942544/5224354917';
  $('ad').hidden=false;
  (async()=>{try{await AD.initialize({initializeForTesting:true})}catch(e){}})();
  AD.addListener('onRewardedVideoAdReward',()=>{save.eggs+=5;persist();ui();msg('+5 ovos! 🥚')});
  AD.addListener('onRewardedVideoAdDismissed',()=>{$('ad').disabled=false});
  $('ad').onclick=async()=>{
    $('ad').disabled=true;setTimeout(()=>{$('ad').disabled=false},20000);
    try{await AD.prepareRewardVideoAd({adId:ADID});await AD.showRewardVideoAd()}
    catch(e){msg('Anúncio indisponível agora. Tente de novo em instantes.');$('ad').disabled=false}
  };
}
ui();reset();syncPaid();requestAnimationFrame(loop);
</script>
